name: CI - Build, Test & Reports

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ./crypto-aggregator-be

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Verify Docker availability
        run: docker info

      - name: Build application (skip tests)
        run: ./gradlew bootJar --no-daemon --stacktrace --console=plain

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-artifact
          path: crypto-aggregator-be/build/libs/*.jar
          retention-days: 7

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            crypto-aggregator-be/build/reports/**/*
          if-no-files-found: warn
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build

    defaults:
      run:
        working-directory: ./crypto-aggregator-be

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-build-artifact
          path: crypto-aggregator-be/build/libs/

      - name: Run tests
        run: ./gradlew test --no-daemon --stacktrace --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            crypto-aggregator-be/build/test-results/test/**/*.xml
            crypto-aggregator-be/build/reports/tests/test/**/*
            crypto-aggregator-be/build/reports/jacoco/test/jacocoTestReport.xml
            crypto-aggregator-be/build/reports/jacoco/test/html/**/*
            crypto-aggregator-be/build/logs/application.log
          if-no-files-found: warn
          retention-days: 7
