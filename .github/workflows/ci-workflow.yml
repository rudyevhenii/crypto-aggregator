name: CI - Build, Test & Reports

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ./crypto-aggregator-be

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Verify Docker availability
        run: docker info

      - name: Run build & all tests
        run: ./gradlew build --no-daemon --stacktrace --console=plain

      - name: Upload All Reports (XML & HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-build-reports
          path: |
            crypto-aggregator-be/build/test-results/test/**/*.xml
            crypto-aggregator-be/build/reports/tests/test/**/*
            crypto-aggregator-be/build/reports/jacoco/test/jacocoTestReport.xml
            crypto-aggregator-be/build/reports/jacoco/test/html/**/*
          if-no-files-found: warn
          retention-days: 7
