spring:
  application:
    name: crypto-aggregator-be
  config:
    import:
      - 'classpath:exchanges.yaml'
      - 'optional:file:.env[.properties]'
  datasource:
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/crypto_aggregator_db
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        globally_quoted_identifiers: true
  flyway:
    locations:
      - 'classpath:/db/migration/schema'
      - 'classpath:/db/migration/data'
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: "smtp.gmail.com"
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

security:
  jwt:
    secret-key: ${SECRET_TOKEN:519265gRvMBWa8iSB8Qj0Za1pZM998WiGELw9L8y56yitcTLOFaEjqrJTGKbYMxr}
    access-token-expiration: ${ACCESS_TOKEN:3600000}
    refresh-token-expiration: ${REFRESH_TOKEN:604800000}

app:
  exchanges:
    enable-all: true
    binance:
      enable: ${app.exchanges.enable-all}
    coinbase:
      enable: ${app.exchanges.enable-all}
    kraken:
      enable: ${app.exchanges.enable-all}
  price-alets:
    scheduler:
      expiration:
        cron: "0 */5 * * * *"
