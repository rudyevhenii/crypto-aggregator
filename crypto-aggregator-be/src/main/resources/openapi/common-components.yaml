openapi: 3.1.0
info:
  title: Common Components
  description: Common Components
  version: 1.0.0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Exchange:
      type: string
      enum:
        - BINANCE
        - COINBASE
        - KRAKEN

    TradingPair:
      type: string
      enum:
        - BTC_USD
        - ETH_USD
        - SOL_USD
        - ADA_USD
        - XRP_USD
        - DOT_USD
        - DOGE_USD
        - LINK_USD
        - LTC_USD
        - AVAX_USD
        - SHIB_USD
        - GRT_USD
        - UNI_USD
        - ATOM_USD
        - BCH_USD
        - ETC_USD
        - XLM_USD
        - ALGO_USD
        - FIL_USD
        - ICP_USD
        - OP_USD
        - ARB_USD
        - AAVE_USD
        - CRV_USD
        - SNX_USD
        - COMP_USD
        - BAT_USD
        - ZRX_USD
        - YFI_USD
        - SUSHI_USD

    ChartInterval:
      type: string
      enum:
        - ONE_SECOND
        - ONE_MINUTE
        - THREE_MINUTES
        - FIVE_MINUTES
        - FIFTEEN_MINUTES
        - THIRTY_MINUTES
        - ONE_HOUR
        - TWO_HOURS
        - FOUR_HOURS
        - SIX_HOURS
        - EIGHT_HOURS
        - TWELVE_HOURS
        - ONE_DAY
        - THREE_DAYS
        - FIFTEEN_DAYS
        - ONE_WEEK
        - ONE_MONTH

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        errors:
          $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      properties:
        field:
          type: string
        error:
          type: string

  responses:
    BadRequest:
      description: "Bad request"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnauthorizedError:
      description: "Unauthorized"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFoundError:
      description: "Not found"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: "Conflict"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: "Internal server error"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
