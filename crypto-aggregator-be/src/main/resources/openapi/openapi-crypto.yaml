openapi: 3.1.0
info:
  title: Crypto Aggregator API
  description: Crypto Aggregator API
  version: 1.0.0
servers:
  - url: 'http://localhost:8080'

paths:
  # ════════════════════════════════════════════════════════════════
  #  Auth
  # ════════════════════════════════════════════════════════════════

  /api/auth/register:
    post:
      summary: "Endpoint to register a user"
      operationId: "register"
      tags:
        - "Auth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        "200":
          description: "Successfully registers a user and returns access and refresh jwt tokens"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        "400":
          $ref: 'common-components.yaml#/components/responses/BadRequest'
        "409":
          $ref: 'common-components.yaml#/components/responses/Conflict'
        "500":
          $ref: 'common-components.yaml#/components/responses/InternalServerError'

  /api/auth/login:
    post:
      summary: "Endpoint to login a user"
      operationId: "login"
      tags:
        - "Auth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: "Successfully registers a user and returns access and refresh jwt tokens"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        "400":
          $ref: 'common-components.yaml#/components/responses/BadRequest'
        "401":
          $ref: 'common-components.yaml#/components/responses/UnauthorizedError'
        "500":
          $ref: 'common-components.yaml#/components/responses/InternalServerError'

  /api/auth/refresh-token:
    post:
      summary: "Refreshes jwt access and refresh tokens"
      operationId: "refreshToken"
      tags:
        - "Auth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        "200":
          description: "Returns refreshed jwt tokens"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        "400":
          $ref: 'common-components.yaml#/components/responses/BadRequest'
        "401":
          $ref: 'common-components.yaml#/components/responses/UnauthorizedError'
        "404":
          $ref: 'common-components.yaml#/components/responses/NotFoundError'
        "500":
          $ref: 'common-components.yaml#/components/responses/InternalServerError'

  # ════════════════════════════════════════════════════════════════
  #  Historical
  # ════════════════════════════════════════════════════════════════

  /api/historical/exchanges/{exchange}/klines:
    get:
      summary: "Get klines charts"
      operationId: "getHistoricalPrices"
      tags:
        - "HistoricalExchange"
      parameters:
        - $ref: '#/components/parameters/ExchangeParam'
        - name: request
          in: query
          style: form
          explode: true
          schema:
            $ref: '#/components/schemas/HistoricalPriceRequest'
      responses:
        "200":
          description: "Successfully retrieves array of historical charts"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoricalPrice'
        "400":
          $ref: 'common-components.yaml#/components/responses/BadRequest'
        "500":
          $ref: 'common-components.yaml#/components/responses/InternalServerError'

  /api/historical/exchanges/{exchange}/tickers/24h:
    get:
      summary: "Get tickers for the exchange"
      operationId: "get24hTickersByExchange"
      tags:
        - "HistoricalExchange"
      parameters:
        - $ref: '#/components/parameters/ExchangeParam'
      responses:
        "200":
          description: "Successfully retrieves array of tickers data for exchange"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticker24h'
        "400":
          $ref: 'common-components.yaml#/components/responses/BadRequest'
        "500":
          $ref: 'common-components.yaml#/components/responses/InternalServerError'

  /api/historical/exchanges/{exchange}/tickers/24h/{pair}:
    get:
      summary: "Get tickers for a trading pair"
      operationId: "get24hTickerForPair"
      tags:
        - "HistoricalExchange"
      parameters:
        - $ref: '#/components/parameters/ExchangeParam'
        - $ref: '#/components/parameters/TradingPairParam'
      responses:
        "200":
          description: "Successfully retrieves ticker for a trading pair"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticker24h'
        "400":
          $ref: 'common-components.yaml#/components/responses/BadRequest'
        "500":
          $ref: 'common-components.yaml#/components/responses/InternalServerError'

  # ════════════════════════════════════════════════════════════════
  #  Live / SSE
  # ════════════════════════════════════════════════════════════════

  /api/stream/exchanges/prices:
    get:
      summary: "Stream prices from all exchanges (SSE)"
      operationId: "streamAllPrices"
      tags:
        - "LiveExchange"
      responses:
        "200":
          description: "Continuous event stream for updating all prices"
          content:
            text/event-stream:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LivePrice'

  /api/stream/exchanges/{exchange}/prices:
    get:
      summary: "Stream prices for the exchange (SSE)"
      operationId: "streamPriceByExchange"
      tags:
        - "LiveExchange"
      parameters:
        - $ref: '#/components/parameters/ExchangeParam'
      responses:
        "200":
          description: "Continuous event stream for updating all prices in exchange"
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/LivePrice'

  /api/stream/exchanges/{exchange}/prices/{pair}:
    get:
      summary: "Stream prices for a trading pair (SSE)"
      operationId: "streamSinglePair"
      tags:
        - "LiveExchange"
      parameters:
        - $ref: '#/components/parameters/ExchangeParam'
        - $ref: '#/components/parameters/TradingPairParam'
      responses:
        "200":
          description: "Continuous event stream for updating prices for specific trading pair"
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/LivePrice'

  /api/stream/exchanges/{exchange}/health:
    get:
      summary: "Stream exchange health (SSE)"
      operationId: "streamExchangeHealth"
      tags:
        - "LiveExchange"
      parameters:
        - $ref: '#/components/parameters/ExchangeParam'
      responses:
        "200":
          description: "Continuous event stream for the health state of the exchange"
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ExchangeHealth'

  # ════════════════════════════════════════════════════════════════
  #  Metadata
  # ════════════════════════════════════════════════════════════════

  /api/exchanges:
    get:
      summary: "Get all exchanges"
      operationId: "getSupportedExchanges"
      tags:
        - "ExchangeMetadata"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Exchange'

  /api/exchanges/{exchange}/pairs:
    get:
      summary: "Get all trading pairs"
      operationId: "getSupportedPairs"
      tags:
        - "ExchangeMetadata"
      description: "Returns all trading pairs for exchange"
      parameters:
        - $ref: '#/components/parameters/ExchangeParam'
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TradingPair'

  /api/exchanges/{exchange}/intervals:
    get:
      summary: "Get intervals for the exchange"
      operationId: "getSupportedIntervals"
      tags:
        - "ExchangeMetadata"
      parameters:
        - $ref: '#/components/parameters/ExchangeParam'
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChartInterval'

  /api/exchanges/metadata:
    get:
      summary: "Get all metadata"
      operationId: "getAllMetadata"
      tags:
        - "ExchangeMetadata"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExchangeMetadata'

  # ════════════════════════════════════════════════════════════════
  #  Exchange Pair
  # ════════════════════════════════════════════════════════════════

  /api/exchange-pairs:
    get:
      summary: "Get all exchange pairs"
      operationId: "findAllExchangePairs"
      tags:
        - "ExchangePair"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExchangePair'
        "401":
          $ref: 'common-components.yaml#/components/responses/UnauthorizedError'
        "500":
          $ref: 'common-components.yaml#/components/responses/InternalServerError'

  /api/exchange-pairs/search:
    get:
      summary: "Search exchange pairs by parameter"
      operationId: "searchExchangePairs"
      tags:
        - "ExchangePair"
      parameters:
        - name: pattern
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExchangePair'
        "401":
          $ref: 'common-components.yaml#/components/responses/UnauthorizedError'
        "500":
          $ref: 'common-components.yaml#/components/responses/InternalServerError'

  # ════════════════════════════════════════════════════════════════
  #  Workspace
  # ════════════════════════════════════════════════════════════════

  /api/workspaces:
    post:
      summary: "Create new workspace"
      operationId: "createWorkspace"
      tags:
        - "Workspace"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceRequest'
      responses:
        "201":
          description: "CREATED"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        "400":
          $ref: 'common-components.yaml#/components/responses/BadRequest'
        "401":
          $ref: 'common-components.yaml#/components/responses/UnauthorizedError'
        "409":
          $ref: 'common-components.yaml#/components/responses/Conflict'
        "500":
          $ref: 'common-components.yaml#/components/responses/InternalServerError'

    get:
      summary: "Get all workspaces"
      operationId: "getAllWorkspaces"
      tags:
        - "Workspace"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
        "401":
          $ref: 'common-components.yaml#/components/responses/UnauthorizedError'
        "500":
          $ref: 'common-components.yaml#/components/responses/InternalServerError'

  /api/workspaces/{workspaceId}:
    patch:
      summary: "Update workspace"
      operationId: "updateWorkspace"
      tags:
        - "Workspace"
      parameters:
        - $ref: '#/components/parameters/WorkspaceParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceRequest'
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        "400":
          $ref: 'common-components.yaml#/components/responses/BadRequest'
        "401":
          $ref: 'common-components.yaml#/components/responses/UnauthorizedError'
        "409":
          $ref: 'common-components.yaml#/components/responses/Conflict'
        "500":
          $ref: 'common-components.yaml#/components/responses/InternalServerError'

    get:
      summary: "Get workspace"
      operationId: "getWorkspaceById"
      tags:
        - "Workspace"
      parameters:
        - $ref: '#/components/parameters/WorkspaceParam'
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        "400":
          $ref: 'common-components.yaml#/components/responses/BadRequest'
        "401":
          $ref: 'common-components.yaml#/components/responses/UnauthorizedError'
        "500":
          $ref: 'common-components.yaml#/components/responses/InternalServerError'

    delete:
      summary: "Delete a workspace"
      operationId: "deleteWorkspace"
      tags:
        - "Workspace"
      parameters:
        - $ref: '#/components/parameters/WorkspaceParam'
      responses:
        "204":
          description: "No content"
        "404":
          $ref: 'common-components.yaml#/components/responses/NotFoundError'
        "500":
          $ref: 'common-components.yaml#/components/responses/InternalServerError'

  /api/workspaces/{workspaceId}/widgets:
    post:
      summary: "Create chart widget"
      operationId: "createChartWidget"
      tags:
        - "ChartWidget"
      parameters:
        - $ref: '#/components/parameters/WorkspaceParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChartWidgetRequest'
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartWidget'
        "400":
          $ref: 'common-components.yaml#/components/responses/BadRequest'
        "401":
          $ref: 'common-components.yaml#/components/responses/UnauthorizedError'
        "404":
          $ref: 'common-components.yaml#/components/responses/NotFoundError'
        "500":
          $ref: 'common-components.yaml#/components/responses/InternalServerError'

    get:
      summary: "Get all chart widgets for a workspace"
      operationId: "getAllByWorkspaceId"
      tags:
        - "ChartWidget"
      parameters:
        - $ref: '#/components/parameters/WorkspaceParam'
      responses:
        "200":
          description: "Ok"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChartWidget'
        "400":
          $ref: 'common-components.yaml#/components/responses/BadRequest'
        "401":
          $ref: 'common-components.yaml#/components/responses/UnauthorizedError'
        "500":
          $ref: 'common-components.yaml#/components/responses/InternalServerError'


  /api/workspaces/{workspaceId}/widgets/{chartWidgetId}:
    patch:
      summary: "Update specific chart widget"
      operationId: "updateChartWidget"
      tags:
        - "ChartWidget"
      parameters:
        - $ref: '#/components/parameters/WorkspaceParam'
        - $ref: '#/components/parameters/ChartWidgetParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChartWidgetRequest'
      responses:
        "200":
          description: "Ok"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartWidget'
        "400":
          $ref: 'common-components.yaml#/components/responses/BadRequest'
        "401":
          $ref: 'common-components.yaml#/components/responses/UnauthorizedError'
        "404":
          $ref: 'common-components.yaml#/components/responses/NotFoundError'
        "500":
          $ref: 'common-components.yaml#/components/responses/InternalServerError'

    delete:
      summary: "Delete specific chart widget"
      operationId: "deleteChartWidget"
      tags:
        - "ChartWidget"
      parameters:
        - $ref: '#/components/parameters/WorkspaceParam'
        - $ref: '#/components/parameters/ChartWidgetParam'
      responses:
        "204":
          description: "No content"
        "400":
          $ref: 'common-components.yaml#/components/responses/BadRequest'
        "401":
          $ref: 'common-components.yaml#/components/responses/UnauthorizedError'
        "404":
          $ref: 'common-components.yaml#/components/responses/NotFoundError'
        "500":
          $ref: 'common-components.yaml#/components/responses/InternalServerError'

  /api/workspaces/{workspaceId}/widgets/positions:
    put:
      summary: "Update chart widget positions"
      operationId: "updateChartWidgetPositions"
      tags:
        - "ChartWidget"
      parameters:
        - $ref: '#/components/parameters/WorkspaceParam'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UpdateChartWidgetPositionsRequest'
      responses:
        "204":
          description: "No content"
        "400":
          $ref: 'common-components.yaml#/components/responses/BadRequest'
        "401":
          $ref: 'common-components.yaml#/components/responses/UnauthorizedError'
        "404":
          $ref: 'common-components.yaml#/components/responses/NotFoundError'
        "500":
          $ref: 'common-components.yaml#/components/responses/InternalServerError'

components:
  schemas:
    # ── Common enums & error models ───────────────────────────────
    Exchange:
      type: string
      enum:
        - BINANCE
        - COINBASE
        - KRAKEN

    TradingPair:
      type: string
      enum:
        - BTC_USD
        - ETH_USD
        - SOL_USD
        - ADA_USD
        - XRP_USD
        - DOT_USD
        - DOGE_USD
        - LINK_USD
        - LTC_USD
        - AVAX_USD

    ChartInterval:
      type: string
      enum:
        - ONE_SECOND
        - ONE_MINUTE
        - THREE_MINUTES
        - FIVE_MINUTES
        - FIFTEEN_MINUTES
        - THIRTY_MINUTES
        - ONE_HOUR
        - TWO_HOURS
        - FOUR_HOURS
        - SIX_HOURS
        - EIGHT_HOURS
        - TWELVE_HOURS
        - ONE_DAY
        - THREE_DAYS
        - FIFTEEN_DAYS
        - ONE_WEEK
        - ONE_MONTH

    # ── Auth schemas ──────────────────────────────────────────────
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - firstName
        - lastName
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 100
        firstName:
          type: string
          minLength: 2
          maxLength: 50
        lastName:
          type: string
          minLength: 2
          maxLength: 50

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 100

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    # ── Historical schemas ────────────────────────────────────────
    HistoricalPriceRequest:
      type: object
      required:
        - tradingPair
        - chartInterval
      properties:
        tradingPair:
          $ref: '#/components/schemas/TradingPair'
        chartInterval:
          $ref: '#/components/schemas/ChartInterval'
        limit:
          type: integer
          format: int32
          minimum: 1
          default: 100
          maximum: 200
        endTimeCursor:
          type: string
          format: date-time

    HistoricalPrice:
      type: object
      properties:
        openTime:
          type: string
          format: date-time
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: number

    Ticker24h:
      type: object
      properties:
        exchange:
          $ref: '#/components/schemas/Exchange'
        tradingPair:
          $ref: '#/components/schemas/TradingPair'
        lastPrice:
          type: number
        priceChangePercent24h:
          type: number
        high24h:
          type: number
        low24h:
          type: number
        volume24h:
          type: number

    # ── Live schemas ──────────────────────────────────────────────
    LivePrice:
      type: object
      properties:
        exchange:
          $ref: '#/components/schemas/Exchange'
        tradingPair:
          $ref: '#/components/schemas/TradingPair'
        lastPrice:
          type: number
        priceChangePercent24h:
          type: number
        highPrice24h:
          type: number
        lowPrice24h:
          type: number
        volume24h:
          type: number
        timestamp:
          type: string
          format: date-time

    ExchangeHealth:
      type: object
      properties:
        exchange:
          $ref: '#/components/schemas/Exchange'
        connectionStatus:
          $ref: '#/components/schemas/ConnectionStatus'
        timestamp:
          type: string
          format: date-time

    ConnectionStatus:
      type: string
      enum:
        - CONNECTED
        - DISCONNECTED
        - RECONNECTING
        - ERROR

    # ── Metadata schemas ──────────────────────────────────────────
    ExchangeMetadata:
      type: object
      properties:
        exchange:
          $ref: '#/components/schemas/Exchange'
        supportedPairs:
          type: array
          items:
            $ref: '#/components/schemas/TradingPair'
        supportedIntervals:
          type: array
          items:
            $ref: '#/components/schemas/ChartInterval'

    # ── Exchange pair schemas ──────────────────────────────────────
    ExchangePair:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tradingPair:
          $ref: '#/components/schemas/TradingPair'
        exchange:
          $ref: '#/components/schemas/Exchange'


    # ── Workspace schemas ──────────────────────────────────────────────
    WorkspaceRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ChartWidgetRequest:
      type: object
      required:
        - exchangePairId
      properties:
        exchangePairId:
          type: string
          format: uuid

    ChartWidget:
      type: object
      properties:
        id:
          type: string
          format: uuid
        chartInterval:
          $ref: '#/components/schemas/ChartInterval'
        exchangePairId:
          type: string
          format: uuid
        tradingPair:
          $ref: '#/components/schemas/TradingPair'
        exchange:
          $ref: '#/components/schemas/Exchange'
        position:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateChartWidgetRequest:
      type: object
      required:
        - chartInterval
      properties:
        chartInterval:
          $ref: '#/components/schemas/ChartInterval'

    UpdateChartWidgetPositionsRequest:
      type: object
      required:
        - chartWidgetId
        - position
      properties:
        chartWidgetId:
          type: string
          format: uuid
        position:
          type: integer

  parameters:
    ExchangeParam:
      in: path
      name: exchange
      required: true
      schema:
        $ref: '#/components/schemas/Exchange'

    TradingPairParam:
      in: path
      name: pair
      required: true
      schema:
        $ref: '#/components/schemas/TradingPair'

    WorkspaceParam:
      in: path
      name: workspaceId
      required: true
      schema:
        type: string
        format: uuid

    ChartWidgetParam:
      in: path
      name: chartWidgetId
      required: true
      schema:
        type: string
        format: uuid
