openapi: 3.1.0
info:
  title: Crypto Aggregator API
  description: Crypto market data aggregation API with authentication, historical prices, live streams, and workspace management.
  version: 1.0.0
servers:
  - url: 'http://localhost:8080'

security:
  - bearerAuth: []

paths:
  /api/exchanges:
    get:
      summary: "Get supported exchanges"
      operationId: "getSupportedExchanges"
      tags:
        - "ExchangeMetadata"
      responses:
        "200":
          description: "Returns list of supported exchanges"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Exchange'

  /api/exchanges/{exchange}/pairs:
    get:
      summary: "Get supported trading pairs for an exchange"
      operationId: "getSupportedPairs"
      tags:
        - "ExchangeMetadata"
      parameters:
        - name: exchange
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Exchange'
      responses:
        "200":
          description: "Returns supported trading pairs"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TradingPair'

  /api/exchanges/{exchange}/intervals:
    get:
      summary: "Get supported chart intervals for an exchange"
      operationId: "getSupportedIntervals"
      tags:
        - "ExchangeMetadata"
      parameters:
        - name: exchange
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Exchange'
      responses:
        "200":
          description: "Returns supported chart intervals"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChartInterval'

  /api/exchanges/metadata:
    get:
      summary: "Get all exchange metadata"
      operationId: "getAllMetadata"
      tags:
        - "ExchangeMetadata"
      responses:
        "200":
          description: "Returns metadata for all supported exchanges"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExchangeMetadata'

components:
  schemas:
    Exchange:
      $ref: 'common-components.yaml#/components/schemas/Exchange'

    ChartInterval:
      $ref: 'common-components.yaml#/components/schemas/ChartInterval'

    TradingPair:
      $ref: 'common-components.yaml#/components/schemas/TradingPair'

    ExchangeMetadata:
      type: object
      description: "Exchange metadata including supported pairs and intervals"
      properties:
        exchange:
          $ref: 'common-components.yaml#/components/schemas/Exchange'
          description: "Exchange name"
        supportedPairs:
          type: array
          items:
            $ref: 'common-components.yaml#/components/schemas/TradingPair'
          description: "Supported trading pairs"
        supportedIntervals:
          type: array
          items:
            $ref: 'common-components.yaml#/components/schemas/ChartInterval'
          description: "Supported chart intervals"
      example:
        exchange: "BINANCE"
        supportedPairs:
          - "BTC_USD"
          - "ETH_USD"
          - "SOL_USD"
        supportedIntervals:
          - "ONE_MINUTE"
          - "FIVE_MINUTES"
          - "ONE_HOUR"
          - "ONE_DAY"

  securitySchemes:
    bearerAuth:
      $ref: 'common-components.yaml#/components/securitySchemes/bearerAuth'
