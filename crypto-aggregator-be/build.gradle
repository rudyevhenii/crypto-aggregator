import org.openapitools.generator.gradle.plugin.tasks.GenerateTask

plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openapi.generator' version '7.4.0'
}

group = 'dev.rudyevhenii'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '21'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webclient'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'

    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    testAnnotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-webclient-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.github.database-rider:rider-spring:1.43.0'
    testImplementation 'io.rest-assured:rest-assured:6.0.1'
    testImplementation 'org.skyscreamer:jsonassert:1.5.3'
}

def apiDomains = [
        "auth"        : "openapi-auth.yaml",
        "historical"  : "openapi-exchange-historical.yaml",
        "live"        : "openapi-exchange-live.yaml",
        "metadata"    : "openapi-metadata.yaml",
        "exchangePair": "openapi-exchange-pair.yaml",
        "workspace"   : "openapi-workspace.yaml",
        "chartWidget" : "openapi-chart-widget.yaml",
        "priceAlert"  : "openapi-price-alert.yaml"
]

apiDomains.each { domainName, fileName ->
    tasks.register("generate${domainName.capitalize()}Api", GenerateTask) {
        generatorName = "spring"
        inputSpec = "$rootDir/src/main/resources/openapi/${fileName}".replace('\\', '/')

        outputDir = layout.buildDirectory.dir("generated-openapi").get().asFile.absolutePath

        apiPackage = "dev.rudyevhenii.crypto_aggregator.api.interfaces.${domainName}"
        modelPackage = "dev.rudyevhenii.crypto_aggregator.api.dto.${domainName}"
        modelNameSuffix = "RqDto"

        configOptions = [
                useBeanValidation    : "true",
                performBeanValidation: "true",
                interfaceOnly        : "true",
                useSpringBoot3       : "true",
                useJakartaEe         : "true",
                skipDefaultInterface : "true",
                useTags              : "true"
        ]
    }
}

tasks.register("generateAllApis") {
    dependsOn apiDomains.collect { domainName, fileName -> "generate${domainName.capitalize()}Api" }
}

tasks.named("compileJava") {
    dependsOn apiDomains.collect { domainName, fileName -> "generate${domainName.capitalize()}Api" }
}

sourceSets {
    main {
        java {
            srcDirs += layout.buildDirectory.dir("generated-openapi/src/main/java").get().asFile
        }
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('test') {
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}